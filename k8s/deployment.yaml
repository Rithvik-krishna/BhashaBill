apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhashabill
  labels:
    app: bhashabill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bhashabill
  template:
    metadata:
      labels:
        app: bhashabill
    spec:
      containers:
        - name: bhashabill
          # Target: k3s on cloud VM (with local KinD + Vercel as fallback) connected to NudgeBee Cloud SaaS.
          # Replace with your pushed registry image (e.g. ghcr.io/<user>/bhashabill:latest)
          image: bhashabill:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            # Create with: kubectl create secret generic bhashabill-env --from-env-file=.env.local
            - secretRef:
                name: bhashabill-env
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_BASE_URL
              value: "http://127.0.0.1:3000"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health?probe=live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
